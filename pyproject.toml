[project]
name = "oceanembed"
version = "0.1.0"
description = "Satellite embedding-based subsurface ocean temperature reconstruction (MVP)"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "xarray",
    "zarr",
    "dask",
    "netCDF4",
    "numpy",
    "scipy",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "matplotlib",
    "copernicusmarine",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
